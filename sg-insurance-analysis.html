function policyCard(p){
  const cat = (DATA.CATEGORIES.find(c=>c.id===p.category)||{}).label || p.category;
  const daysLeft = Utils.daysUntil(p.endDate);
  let statusBadge = `<span class="badge badge-emerald">Active</span>`;
  if(p.status==='archived') statusBadge = `<span class="badge badge-neutral">Archived</span>`;
  else if(p.status==='lapsed') statusBadge = `<span class="badge badge-brick">Lapsed</span>`;
  else if(p.status==='expired' || (daysLeft!==null && daysLeft<0)) statusBadge = `<span class="badge badge-brick">Expired</span>`;
  else if(daysLeft!==null && daysLeft<=90) statusBadge = `<span class="badge badge-amber">Expiring Soon</span>`;
  const ilpBadge = p.category==='ilp' ? `<span class="badge badge-blue">ILP \u2014 excluded from gap analysis</span>` : '';
  return `
  <div class="policy-card ${p.status==='archived'?'archived':''}">
    <div class="policy-top">
      <div>
        <div class="policy-provider">${DATA.label(p.provider)}</div>
        <div class="policy-name">${Utils.escapeHtml(p.product)}</div>
      </div>
    </div>
    <div class="policy-meta">
      <span class="badge badge-neutral">${cat}</span>
      ${statusBadge}
      ${ilpBadge}
      ${(p.riders||[]).length ? `<span class="badge badge-blue">${p.riders.length} rider${p.riders.length>1?'s':''}</span>`:''}
    </div>
    <div class="policy-figures">
      <div><div class="pf-label">Coverage</div><div class="pf-value">${Utils.fmtMoney(p.coverageAmount,{abbr:true})}</div></div>
      <div><div class="pf-label">Annual Premium</div><div class="pf-value">${Utils.fmtMoney(p.annualPremium)}</div></div>
      <div><div class="pf-label">Start</div><div class="pf-value" style="font-size:12px;">${Utils.fmtDate(p.startDate)}</div></div>
      <div><div class="pf-label">End</div><div class="pf-value" style="font-size:12px;">${p.endDate?Utils.fmtDate(p.endDate):'\u2014'}</div></div>
    </div>
    <div class="help-text">Owner: ${Utils.escapeHtml(p.owner)} \u00b7 Life Assured: ${Utils.escapeHtml(p.lifeAssured)}</div>
    <div class="policy-actions">
      <button class="btn btn-ghost btn-sm" onclick="Views.openPolicyModal('${p.id}')">${icon('edit',13)} Edit</button>
      <button class="btn btn-ghost btn-sm" onclick="Actions.duplicatePolicy('${p.id}')">${icon('copy',13)} Duplicate</button>
      <button class="btn btn-ghost btn-sm" onclick="Actions.archivePolicy('${p.id}')">${icon('archive',13)} ${p.status==='archived'?'Unarchive':'Archive'}</button>
      <button class="btn btn-danger btn-sm" onclick="Actions.deletePolicy('${p.id}')">${icon('trash',13)} Delete</button>
    </div>
  </div>`;
}

/* ---------------- GAP ANALYSIS VIEW ---------------- */
Views.handlers.gaps = function gapsView(){
  const rows = GapEngine.analyse(State.profile);
  const priorityOrder = {high:0, medium:1, low:2};
  const sorted = [...rows].sort((a,b)=>priorityOrder[a.priority]-priorityOrder[b.priority]);
  const priBadge = pr => pr==='high'?'<span class="badge badge-brick">High Priority</span>':pr==='medium'?'<span class="badge badge-amber">Medium Priority</span>':'<span class="badge badge-emerald">Low Priority</span>';
  return `
  <div class="card card-lg" style="margin-bottom:20px;">
    <div class="card-title">Portfolio-wide Gap Analysis</div>
    <div class="card-desc">Recommended coverage is calculated holistically from your profile (income, dependants, liabilities), then compared against everything currently in your portfolio \u2014 not policy-by-policy.</div>
    <div class="divider"></div>
    ${sorted.map(r=>`
      <div class="gap-row">
        <div>
          <div class="gap-cat">${r.label}</div>
          <div style="margin-top:4px;">${priBadge(r.priority)}</div>
        </div>
        <div>
          <div class="gap-bar-track"><div class="gap-bar-fill" style="width:${Utils.clamp(r.pct,0,100)}%;background:${r.priority==='high'?'var(--brick)':r.priority==='medium'?'var(--amber)':'var(--emerald)'};"></div></div>
          <div class="help-text" style="margin-top:5px;">Current ${Utils.fmtMoney(r.have,{abbr:true})} of recommended ${Utils.fmtMoney(r.need,{abbr:true})}${r.gap>0?` \u2014 gap of ${Utils.fmtMoney(r.gap,{abbr:true})}`:''}</div>
        </div>
        <div class="gap-pct">${Math.round(r.pct)}%</div>
        <div style="text-align:right;"><span class="riskbadge-${r.risk}" style="font-size:12px;font-weight:700;text-transform:uppercase;">${r.risk}</span></div>
      </div>`).join('')}
  </div>
  <div class="card card-lg" style="margin-bottom:20px;">
    <div class="card-title">Protection Pyramid</div>
    <div class="card-desc">Core protection layers, from foundation (hospitalisation) to advanced (disability &amp; mortgage), shaded by how funded each layer is.</div>
    ${Charts.pyramid([
      {label:'Emergency Fund', pct: rows.find(r=>r.id==='emergency').pct},
      {label:'Hospitalisation', pct: rows.find(r=>r.id==='hosp').pct},
      {label:'Critical Illness', pct: rows.find(r=>r.id==='ci').pct},
      {label:'Life Insurance', pct: rows.find(r=>r.id==='life').pct},
      {label:'Disability Income', pct: rows.find(r=>r.id==='di').pct},
    ])}
  </div>
  ${Views.disclaimer()}
  `;
};

    <div class="card">
      <div class="card-title">Before: ${result.scenario.label}</div>
      <div class="stat-value" style="margin:10px 0;">${result.before.score.overall} <span style="font-size:13px;color:var(--text-faint);">/ 100 (${result.before.score.grade})</span></div>
      ${result.before.gaps.filter(g=>g.priority!=='low').slice(0,5).map(g=>Views.gapMini(g)).join('') || '<div class="help-text">No notable gaps.</div>'}
    </div>
    <div class="card" style="border-color:var(--emerald);">
      <div class="card-title">After: ${result.scenario.label}</div>
      <div class="stat-value" style="margin:10px 0;">${result.after.score.overall} <span style="font-size:13px;color:var(--text-faint);">/ 100 (${result.after.score.grade})</span></div>
      ${result.after.gaps.filter(g=>g.priority!=='low').slice(0,5).map(g=>Views.gapMini(g)).join('') || '<div class="help-text">No notable gaps.</div>'}
    </div>
  </div>
  <div class="card" style="margin-bottom:20px;">
    <div class="card-title">What Changes</div>
    <div class="grid grid-3">
      ${['life','ci','di','hosp','mortgage'].map(id=>{
        const b = result.before.gaps.find(g=>g.id===id), a = result.after.gaps.find(g=>g.id===id);
        const delta = a.need - b.need;
        if(Math.abs(delta) < 1) return '';
        return `<div class="card" style="box-shadow:none;">
          <div class="stat-label">${a.label}</div>
          <div style="font-size:13px;margin-top:6px;">Recommended coverage ${delta>0?'increases':'decreases'} by <strong class="${delta>0?'trend-down':'trend-up'}">${Utils.fmtMoney(Math.abs(delta),{abbr:true})}</strong></div>
        </div>`;
      }).join('')}
    </div>
  </div>` : `<div class="card"><div class="empty-state">${icon('route',36)}<div>Select a life event above to see the before/after comparison.</div></div></div>`}
  ${Views.disclaimer()}
  `;
};

    <div class="card-title">Premium Allocation</div><div class="card-desc">Annual premium by insurance type</div>
    ${Charts.hbar(Object.entries(Utils.groupBy(PortfolioEngine.activePolicies(),p=>p.category)).map(([cat,arr])=>({label:(DATA.CATEGORIES.find(c=>c.id===cat)||{}).label||cat, value:Utils.sum(arr,p=>p.annualPremium)})).sort((a,b)=>b.value-a.value))}

  <div class="card" style="margin-bottom:20px;">
    <div class="card-title">Policy Expiry Timeline</div><div class="card-desc">All active policies with an end date, relative to today</div>
    ${Charts.timeline(PortfolioEngine.activePolicies())}

  <div class="grid grid-2" style="margin-bottom:20px;">
    <div class="card"><div class="card-title">Insurance Health Score Gauge</div>
      <div style="display:flex;justify-content:center;">${Charts.gauge(s.overall,100)}</div></div>
    <div class="card"><div class="card-title">Risk Matrix</div><div class="card-desc">Category vs. current risk level</div>

  return `

/* ---------------------------------------------------------------------
   MODULE: Actions — event handler glue for inline DOM events.
--------------------------------------------------------------------- */
const Actions = (() => {
  function updateProfileField(id, value, type){
    const numericFields = ['age','annualIncome','monthlyIncome','children','dependants','mortgageBalance','otherLoans','emergencyFund','netWorth','cpfOA','cpfSA','cpfMA','retirementSavings'];
    const v = numericFields.includes(id) ? Number(value)||0 : value;
    State.updateProfile({[id]: v});
    UI.updateScorePill();
    if(State.activeTab==='dashboard') Views.render('dashboard');
  }

  function setPortfolioFilter(key, value){
    portfolioUIState[key] = value;
    Views.render('portfolio');
  }

  function duplicatePolicy(id){ State.duplicatePolicy(id); UI.toast('Policy duplicated'); Views.render('portfolio'); UI.updateScorePill(); }
  function archivePolicy(id){ State.archivePolicy(id); UI.toast('Policy status updated'); Views.render('portfolio'); UI.updateScorePill(); }
  function deletePolicy(id){
    if(confirm('Delete this policy? This cannot be undone.')){
      State.deletePolicy(id); UI.toast('Policy deleted'); Views.render('portfolio'); UI.updateScorePill();
    }
  }

  function runScenario(id){ scenarioSelected = id; Views.render('scenarios'); }

  function toggleFaq(idx){
    const el = document.getElementById('faq_'+idx);
    el.classList.toggle('open');
  }

  function exportCSV(){
    const cols = ['provider','category','product','coverageAmount','sumAssured','monthlyPremium','annualPremium','startDate','endDate','status','owner','lifeAssured','beneficiary','riders','waitingPeriod','notes'];
    const header = cols.join(',');
    const rows = State.portfolio.map(p => cols.map(c=>{
      let v = c==='riders' ? (p.riders||[]).join('; ') : p[c];
      v = (v==null?'':String(v)).replace(/"/g,'""');
      return /[,"\n]/.test(v) ? `"${v}"` : v;
    }).join(','));
    Utils.download('shieldcheck-portfolio.csv', [header, ...rows].join('\n'), 'text/csv');
    UI.toast('CSV exported');
  }
  function exportJSON(){
    const payload = { profile: State.profile, portfolio: State.portfolio, settings: State.settings, exportedAt: new Date().toISOString() };
    Utils.download('shieldcheck-backup.json', JSON.stringify(payload, null, 2), 'application/json');
    UI.toast('JSON exported');
  }
  function importJSON(){
    const input = document.getElementById('importFile');
    const file = input.files[0];
    if(!file){ UI.toast('Choose a file first', 'error'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        State.replaceAll({ profile: {...State.profile, ...(parsed.profile||{})}, portfolio: parsed.portfolio||[], settings: {...State.settings, ...(parsed.settings||{})}, activeTab: State.activeTab });
        UI.toast('Backup imported');
        UI.setTheme(State.settings.theme||'light');
        Views.render(State.activeTab);
        UI.updateScorePill();
      }catch(e){ UI.toast('Invalid backup file', 'error'); }
    };
    reader.readAsText(file);
  }
  function resetAll(){
    if(confirm('This will permanently erase your saved profile and portfolio from this browser. Continue?')){
      State.resetAll();
      UI.toast('All data reset');
      Views.render(State.activeTab);
      UI.updateScorePill();
    }
  }

  return { updateProfileField, setPortfolioFilter, duplicatePolicy, archivePolicy, deletePolicy, runScenario, toggleFaq, exportCSV, exportJSON, importJSON, resetAll };
})();

document.addEventListener('DOMContentLoaded', UI.init);
